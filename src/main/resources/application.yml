server:
  port: 8087 # 服务端口

spring:
  application:
    name: dyh-sales-agent # 应用名称
  main:
    web-application-type: servlet   # 同时引了 webflux 时强制使用 servlet 模式，避免 actuator 端点映射异常
  data:
    redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD}
        database: 0

  # 数据库
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sales_analysis_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10   # 连接池最多同时提供 10 个数据库连接
      minimum-idle: 2         # 空闲时至少保留 2 个连接，减少临时建连等待
      connection-timeout: 30000  # 取不到连接时最多等待 30 秒，单位毫秒

  # SQL 初始化（建表 + 测试数据，IF NOT EXISTS + INSERT IGNORE 安全重复执行）
  sql:
    init:
      mode: always # 项目启动就建立
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # JPA
  jpa:
    hibernate:
      ddl-auto: none            # 使用 schema.sql 建表，不用 JPA 自动建表
    show-sql: false # sql不打印
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true  # 等 JPA 初始化后再执行 SQL 脚本

# LangChain4j OpenAI 兼容接口 → DashScope
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-max
      temperature: 0.1          # 数据分析场景用低温度，减少随机性
      max-tokens: 2048
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-max
      temperature: 0.1
      max-tokens: 2048

# Sa-Token 配置（轻量权限框架）
sa-token:
  token-name: Authorization # 权限认证时的前缀名称，下面的是固定的
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# Actuator，项目监控用的，TokenUsageLogger.java用，例如http://localhost:8087/actuator/metrics/llm.tokens.input可以看累计Token数
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # 项目监控了什么东西

  endpoint:
    health:
      show-details: always

# 应用自定义配置
sales-agent:
  tool:
    anomaly-threshold-days: 5
    trend-drop-threshold: 0.3
  agentscope:
    model-name: qwen-max
    temperature: 0.1
    max-tokens: 2048
    max-iters: 10
    state:
      initialize-schema: true
    team:
      supervisor-max-iters: 8
      specialist-max-iters: 6
  routing:
    default-mode: AGENTSCOPE_TEAM
    fallback-enabled: true
    fallback-mode: LANGCHAIN4J
    allow-request-override: true

logging:
  level:
    com.dyh.salesAgent: DEBUG
    dev.langchain4j: INFO
app:
  auth:
    enabled: true
    dev:
      user-id: 13
      username: 本地开发总监
      role: SALES_DIRECTOR
      region-id: 1
      rep-id: 13
